# Git hooks, installed by `pnpm install` through the "prepare" script.
# CI runs the same checks over the whole tree, so skipping hooks does not skip the checks.

pre-commit:
  parallel: true
  jobs:
    - name: forbidden or oversized files
      run: node scripts/check-repo-files.mjs {staged_files}
    - name: secrets
      run: pnpm exec secretlint --maskSecrets {staged_files}
    - name: formatting
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

commit-msg:
  jobs:
    - name: conventional commit message
      run: pnpm exec commitlint --edit {1}
